services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeguardian_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Docker Desktop defines host.docker.internal, but Docker on Linux doesn't.
    # `host-gateway` maps it to the host's address on the Docker bridge, so
    # the container can reach Ollama running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeguardian_worker
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # No --reload here: after changing the code, run
    # `docker compose restart worker`.
    # Docker Desktop defines host.docker.internal, but Docker on Linux doesn't.
    # `host-gateway` maps it to the host's address on the Docker bridge, so
    # the container can reach Ollama running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m src.worker
    restart: unless-stopped

  # Relays GitHub webhooks from a smee.io channel to the API, for local
  # testing only. It is in the `live` profile, so it starts only with
  # `docker compose --profile live up -d smee`.
  smee:
    image: node:22-alpine
    container_name: codeguardian_smee
    profiles: ["live"]
    env_file:
      - .env
    depends_on:
      - api
    # `$$` reaches the shell as `$`, so the variable is read from the
    # container's environment and not interpolated by Compose, which would
    # fail every Compose command for anyone without SMEE_URL set.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        test -n "$$SMEE_URL" || { echo "Set SMEE_URL in .env"; exit 1; };
        exec npx --yes smee-client@5.0.0
        --url "$$SMEE_URL"
        --target http://api:8000/api/v1/webhooks/github/pr

  postgres:
    image: postgres:16-alpine
    container_name: codeguardian_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codeguardian_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: codeguardian_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: